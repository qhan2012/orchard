# Copy to targets.yaml (gitignored) and edit. See DESIGN.md section 2.
# Put ProxyJump, User, IdentityFile in ~/.ssh/config, not here.
# Test first: ssh -o BatchMode=yes <host> true
# workdir: where task workspaces go, <workdir>/<task>. Default ~/myworks. Must end in myworks.
#          /publish reviews it with you and writes it here on first use.
# datadir: optional, for large outputs when the only big disk is purged.
# agent:   optional default agent kind for agents that run on this entry (herdr --kind). Default: claude.
# agent_args: optional, per kind: native CLI arguments passed after `--` at start.
#          Default for claude workers: ["--dangerously-skip-permissions"] (no permission prompts).
#          An entry here replaces the default. Other kinds have no default: set their flag here.

local:                      # this machine: research tasks and runner: local agents
  agent: claude
  # agent_args:
  #   claude: ["--dangerously-skip-permissions"]   # the default; write another value to change it
  #   codex: [...]                                 # no default: you choose

box1:                       # type A: direct node
  enter: "ssh box1"
  runner: herdr

hpc1:                       # type B1: jumper that can run agents, Slurm
  enter: "ssh hpc1-login"
  job_exec: "srun --jobid={job} --overlap"
  runner: herdr
  agent: codex              # default agent kind on this target

corp:                       # type B2: jumper for scheduler commands only, in-house scheduler
  enter: "ssh corp-jumper"
  job_exec: "myrun --job {job} --"
  runner: local
  workdir: /proj/<user>/myworks       # not purged, seen on compute nodes
  datadir: /scratch/<user>/myworks    # purged after N days: large outputs only
