# Copy to inventory.yaml (gitignored) and edit. All site values live here.
# Hosts are OpenSSH hosts or aliases: put ProxyJump, User, IdentityFile in
# ~/.ssh/config, not here. Test first with: ssh -o BatchMode=yes <host> true

defaults:
  ssh_options: ["-o", "ServerAliveInterval=30"]

clusters:
  hpc1:
    head: hpc1-login          # Slurm login/head node; all sbatch/squeue/scancel run here
    scheduler: slurm
    sbatch_defaults:          # merged into every sbatch; --opt on the CLI wins
      partition: gpu
      time: "04:00:00"
      gres: "gpu:1"

nodes:
  box1:
    host: box1                # plain SSH node, no scheduler

herdr:
  session: orchard            # named herdr session orchard uses on every target
  binary: herdr

fleet:
  max_agents: 16              # attention budget: start refuses past this many live agents
  # Local command run once per event (needs_decision, finished, ...). argv, no shell.
  # Placeholders: {title} {body} {event} {target} {name} {status}
  notify: ["notify-send", "{title}", "{body}"]
  #   macOS:  ["terminal-notifier", "-title", "{title}", "-message", "{body}"]
  #   phone:  ["curl", "-s", "-d", "{title} {body}", "https://ntfy.sh/<your-topic>"]
  roles:                      # default agent kind per role; reviewer must differ from builder
    builder: claude
    reviewer: codex
