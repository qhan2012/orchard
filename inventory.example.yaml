# Copy to inventory.yaml (gitignored) and edit. All site values live here.
# Hosts are OpenSSH hosts or aliases: put ProxyJump, User, IdentityFile in
# ~/.ssh/config, not here. Test first with: ssh -o BatchMode=yes <host> true

defaults:
  ssh_options: ["-o", "ServerAliveInterval=30"]

clusters:
  hpc1:
    head: hpc1-login          # Slurm login/head node; all sbatch/squeue/scancel run here
    scheduler: slurm
    sbatch_defaults:          # merged into every sbatch; --opt on the CLI wins
      partition: gpu
      time: "04:00:00"
      gres: "gpu:1"
    # job_exec defaults to: srun --jobid={job} --overlap --nodes=1 --ntasks=1 bash -lc {cmd}

  corp:
    head: corp-jumper         # jumper with an in-house, Slurm-like scheduler
    scheduler: custom         # no slurm subcommands here yet; exec/check/herdr work
    # Head-side command that runs {cmd} inside running job {job}. Both are shell-quoted.
    job_exec: "myrun --job {job} -- bash -lc {cmd}"

nodes:
  box1:
    host: box1                # plain SSH node, no scheduler

herdr:
  session: orchard            # named herdr session orchard uses on every target
  binary: herdr
